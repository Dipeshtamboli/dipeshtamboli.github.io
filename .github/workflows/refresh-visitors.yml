name: Refresh visitor globe
on:
  schedule:
    - cron: "17 6 * * *"   # daily ~06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch GoatCounter locations
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE || 'dipeshtamboli' }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: python scripts/fetch_visitors.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- _data/visitors.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add _data/visitors.json
            git commit -m "Refresh visitor stats [skip ci]"
            git push
          else
            echo "No change."
          fi
