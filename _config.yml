title: Dipesh Tamboli
description: >-
  Dipesh Tamboli — Research Scientist at Meta. Alignment, privacy-preserving
  training, and trustworthiness of large language and foundation models.
author: Dipesh Tamboli
url: "https://dipeshtamboli.github.io"
baseurl: ""

# Social-share preview card (Open Graph / Twitter). Applied to every page via
# front-matter defaults so jekyll-seo-tag emits og:image + twitter:image and
# upgrades the Twitter card to summary_large_image.
defaults:
  - scope:
      path: ""
    values:
      image: /images/og-card.png

twitter:
  card: summary_large_image

# bump to force browsers to fetch fresh site.css / theme.js
asset_ver: "19"

scholar_url: "https://scholar.google.com/citations?user=H8YEc-gAAAAJ&hl=en"

# GoatCounter privacy-friendly analytics: set to your site code (e.g. "dipeshtamboli")
# after signing up at https://www.goatcounter.com/signup — empty disables tracking.
goatcounter_code: "dipeshtamboli"

# Cloudflare Worker URL for the city-level visitor globe (see worker/README.md).
# Empty = globe falls back to GoatCounter country data; no beacon is sent.
visitor_worker: ""

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - .jekyll-cache
  - "*.py"
  - "*.sh"
  - python-content.html
  - python-content.example.html
  - visitors-content.html
  - visitors-content.example.html
  - worker
