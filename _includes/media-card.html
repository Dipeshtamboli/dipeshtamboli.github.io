{%- assign c = include.card -%}
        <a class="media-card" href="{{ c.href }}">
          {%- if c.thumb %}
          {%- if c.thumb_modern %}
          <picture>
            <source type="image/avif" srcset="{{ '/images/media/' | append: c.thumb_modern | relative_url }}">
            <img class="thumb" src="{{ '/images/media/' | append: c.thumb | relative_url }}" alt="" loading="lazy" decoding="async" width="640" height="360">
          </picture>
          {%- else %}
          {%- assign thumb_webp = c.thumb | replace: '.jpg', '.webp' -%}
          <picture>
            <source type="image/webp" srcset="{{ '/images/media/' | append: thumb_webp | relative_url }}">
            <img class="thumb" src="{{ '/images/media/' | append: c.thumb | relative_url }}" alt="" loading="lazy" decoding="async" width="640" height="360">
          </picture>
          {%- endif %}
          {%- else %}
          <div class="thumb-ph"><img src="{{ '/images/favicons/' | append: c.fav | relative_url }}" alt="" loading="lazy" decoding="async" width="54" height="54"></div>
          {%- endif %}
          <div class="head">
            <img class="fav" src="{{ '/images/favicons/' | append: c.fav | relative_url }}" alt="" loading="lazy" decoding="async" width="30" height="30">
            <span class="name">{{ c.name }}</span>
          </div>
          <div class="desc">{{ c.desc }}</div>
          <div class="region">{{ c.region }}</div>
        </a>
