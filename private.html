---
layout: default
favicon: solid
title: "Private — Dipesh Tamboli"
noindex: true
sitemap: false
---
  <main>
    <section id="lock">
      <p class="eyebrow">Private</p>
      <h2>Password required</h2>
      <p class="prose" style="margin-top:0">This page is encrypted. Enter the password to view it.</p>
      <form id="pform" class="lockform" autocomplete="off">
        <input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
        <button type="submit">Unlock</button>
        <span id="err" class="lockerr" role="alert"></span>
      </form>
    </section>

    <section id="secret" hidden></section>
  </main>

  <script id="payload" type="application/json">{{ site.data.private | jsonify }}</script>
  <script>
    (function () {
      var payload = JSON.parse(document.getElementById('payload').textContent || '{}');
      var form = document.getElementById('pform');
      var err = document.getElementById('err');
      if (!payload.b64) { err.textContent = 'No encrypted content configured.'; return; }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        err.textContent = '';
        var pw = document.getElementById('pw').value || '';
        try {
          var raw = Uint8Array.from(atob(payload.b64.replace(/\s+/g, '')), function (c) { return c.charCodeAt(0); });
          // openssl format: "Salted__" (8) + salt (8) + ciphertext
          var salt = raw.slice(8, 16), ct = raw.slice(16);
          var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
          var bits = new Uint8Array(await crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, base, 384)); // 48 bytes
          var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
          var buf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, ct);
          document.getElementById('secret').innerHTML = new TextDecoder().decode(buf);
          document.getElementById('secret').hidden = false;
          document.getElementById('lock').hidden = true;
          history.replaceState(null, '', '#unlocked');
        } catch (ex) {
          err.textContent = 'Wrong password.';
          document.getElementById('pw').select();
        }
      });
    })();
  </script>
