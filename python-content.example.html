import re, io, base64, collections
import matplotlib
matplotlib.use("AGG")
import matplotlib.pyplot as plt
from js import PUB_YEARS, document

years = []
for y in PUB_YEARS.to_py():
    m = re.search(r"\d{4}", str(y))
    if m:
        years.append(int(m.group()))

counts = collections.Counter(years)
xs = list(range(min(counts), max(counts) + 1))
ys = [counts.get(x, 0) for x in xs]

fig, ax = plt.subplots(figsize=(7, 3.2))
ax.bar([str(x) for x in xs], ys, color="#2d6cdf")
ax.set_title("Publications per year")
ax.set_ylabel("count")
ax.spines[["top", "right"]].set_visible(False)
for i, v in enumerate(ys):
    if v:
        ax.text(i, v + 0.04, str(v), ha="center", fontsize=8)
fig.tight_layout()

buf = io.BytesIO()
fig.savefig(buf, format="png", dpi=140, transparent=True)
data = base64.b64encode(buf.getvalue()).decode()
document.getElementById("pyFig").innerHTML = (
    '&lt;img alt="Publications per year" style="max-width:100%" src="data:image/png;base64,' + data + '"&gt;'
)
print("Plotted", sum(ys), "publications from", min(xs), "to", max(xs))
