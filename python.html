---
layout: default
favicon: solid
title: "Python — Dipesh Tamboli"
noindex: true
sitemap: false
---
  <main>
    <section id="lock">
      <p class="eyebrow">You found the easter egg</p>
      <h1 class="sect-title">Python 🐍</h1>
      <p class="prose" style="margin-top:0">This playground is locked. Enter the password to open it.</p>
      <form id="pform" class="lockform" autocomplete="off">
        <input id="pw" type="password" placeholder="Password" aria-label="Password" autocomplete="current-password">
        <button type="submit">Unlock</button>
        <span id="err" class="lockerr" role="alert"></span>
      </form>
    </section>

    <section id="secret" hidden></section>

    <p class="prose" style="margin-top:22px">
      <a href="{{ '/visitors.html' | relative_url }}">🌍 Visitor globe</a>
      &nbsp;·&nbsp;
      <a href="{{ '/' | relative_url }}">← Back to home</a>
    </p>
  </main>

  <script id="payload" type="application/json">{{ site.data.python | jsonify }}</script>
  <script>window.PUB_YEARS = {{ site.data.publications | map: "year" | jsonify }};</script>
  <script>
    (function () {
      var payload = JSON.parse(document.getElementById('payload').textContent || '{}');
      var form = document.getElementById('pform');
      var err = document.getElementById('err');
      var secret = document.getElementById('secret');
      if (!payload.b64) { err.textContent = 'No content configured.'; return; }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        err.textContent = '';
        var pw = document.getElementById('pw').value || '';
        try {
          var raw = Uint8Array.from(atob(payload.b64.replace(/\s+/g, '')), function (c) { return c.charCodeAt(0); });
          var salt = raw.slice(8, 16), ct = raw.slice(16); // openssl "Salted__" + salt(8) + ciphertext
          var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
          var bits = new Uint8Array(await crypto.subtle.deriveBits(
            { name: 'PBKDF2', salt: salt, iterations: 200000, hash: 'SHA-256' }, base, 384));
          var key = await crypto.subtle.importKey('raw', bits.slice(0, 32), { name: 'AES-CBC' }, false, ['decrypt']);
          var buf = await crypto.subtle.decrypt({ name: 'AES-CBC', iv: bits.slice(32, 48) }, key, ct);
          secret.innerHTML = new TextDecoder().decode(buf);
          secret.hidden = false;
          document.getElementById('lock').hidden = true;
          history.replaceState(null, '', '#unlocked');
          initPlayground();
        } catch (ex) {
          err.textContent = 'Wrong password.';
          document.getElementById('pw').select();
        }
      });

      function loadPyodideScript() {
        return new Promise(function (res, rej) {
          if (window.loadPyodide) return res();
          var s = document.createElement('script');
          s.src = 'https://cdn.jsdelivr.net/pyodide/v0.26.4/full/pyodide.js';
          s.onload = function () { res(); };
          s.onerror = rej;
          document.head.appendChild(s);
        });
      }

      function initPlayground() {
        var runBtn = document.getElementById('pyRun');
        var codeEl = document.getElementById('pyCode');
        var outEl = document.getElementById('pyOut');
        var statusEl = document.getElementById('pyStatus');
        if (!runBtn) return;
        var pyPromise = null;
        function ensurePy() {
          if (!pyPromise) {
            statusEl.textContent = 'loading Python…';
            pyPromise = loadPyodideScript().then(function () { return loadPyodide(); }).then(function (py) {
              py.setStdout({ batched: function (s) { outEl.textContent += s; } });
              py.setStderr({ batched: function (s) { outEl.textContent += s; } });
              statusEl.textContent = 'ready';
              return py;
            });
          }
          return pyPromise;
        }
        runBtn.addEventListener('click', async function () {
          runBtn.disabled = true;
          outEl.textContent = '';
          var figEl = document.getElementById('pyFig');
          if (figEl) figEl.innerHTML = '';
          try {
            var py = await ensurePy();
            try { statusEl.textContent = 'loading packages…'; await py.loadPackagesFromImports(codeEl.value); } catch (_) {}
            statusEl.textContent = 'running…';
            try { await py.runPythonAsync(codeEl.value); statusEl.textContent = 'done'; }
            catch (e) { outEl.textContent += '\n' + e; statusEl.textContent = ''; }
          } catch (e2) {
            statusEl.textContent = 'failed to load Python';
          }
          runBtn.disabled = false;
        });
      }
    })();
  </script>
